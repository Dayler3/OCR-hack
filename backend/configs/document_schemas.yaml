# Декларативная конфигурация типов документов.
# Новые типы добавляются сюда без правок Python-кода (бонусное требование ТЗ §5).
#
# Типы полей (extractor.py):
#   ner_person       — ФИО: regex из схемы, при промахе Natasha NER
#   regex            — регулярное выражение (группа 1 = значение)
#   options          — нечёткий поиск одного из вариантов (RapidFuzz)
#   anchor_after     — значение после якорного слова до конца строки
#   cv_stamp_and_sign— печать+подпись через CV-детекторы («есть»/«нет»)
#   cv_signature_only— только подпись через CV-детектор («есть»/«нет»)

documents:
  study_certificate:
    name: "Справка об обучении"
    anchors:
      - "справка об обучении"
      - "действительно обучается"
      - "в том что он"
      - "в том что она"
      - "справка дана"
      - "настоящая справка выдана"
      - "является студентом"
      - "обучается на"
    keywords:
      - "справк"
      - "обуча"
      - "студент"
      - "являет"
      - "курс"
      - "отделени"
      - "направлен"
      - "специальност"
      - "факультет"
      - "университет"
      - "институт"
      - "академи"
      - "вуз"
      - "зачислен"
      - "очн"
      - "заочн"
    question_keywords:
      - "перевест"
      - "перевод"
      - "обучен"
      - "учусь"
      - "учится"
      - "курс"
      - "вуз"
      - "справк"
      - "стипенд"
      - "военкомат"
    fields:
      fio:
        label: "ФИО студента"
        type: "ner_person"
        regex: "(?:[Вв]ыдана|[Дд]ана|[Дд]ано|студент[а-я]*)\\s+([А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+)"
      university:
        label: "Название вуза"
        type: "anchor_after"
        anchors: ["университет", "институт", "академия", "образовательная организация", "обучается"]
      study_direction:
        label: "Направление подготовки"
        type: "regex"
        regex: "(?:[Нн]аправлени[юе]|[Сс]пециальност[иь])\\s*(?:подготовки)?\\s*[:\\-]?\\s*([А-Яа-яA-Za-z0-9 \\.\"]+?)(?=\\s+форм|\\n|$)"
      study_form:
        label: "Форма обучения"
        type: "options"
        options: ["очно-заочная", "очная", "заочная"]
      study_period:
        label: "Период обучения"
        type: "regex"
        regex: "[Пп]ериод[а-я]*\\s*(?:обучения)?\\s*[Сс]\\s+(\\d{2}\\.\\d{2}\\.\\d{4})\\s*(?:по|-|до)\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
        join_groups: " по "
      doc_number_and_date:
        label: "Номер и дата выдачи"
        type: "regex"
        regex: "№\\s*([A-Za-zА-Яа-я0-9\\-/]+)\\s+от\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
        regex_alt: "(\\d{2}\\.\\d{2}\\.\\d{4})[^\\n]{0,45}?№\\s*([A-Za-zА-Яа-я0-9\\-/]+)"
        alt_swap_groups: true
        join_groups: " от "
        take_last: true   # «Приказ о зачислении №…» встречается раньше номера справки
      stamp_and_signature:
        label: "Подпись и печать"
        type: "cv_stamp_and_sign"

  academic_leave_application:
    name: "Заявление на академический отпуск"
    anchors:
      - "заявление"
      - "академический отпуск"
      - "прошу предоставить"
      - "по состоянию здоровья"
      - "по семейным обстоятельствам"
      - "декану факультета"
    keywords:
      - "заявлен"
      - "академ"
      - "отпуск"
      - "прошу предостав"
      - "прошу"
      - "деканат"
      - "декану"
      - "прерыва"
      - "здоровь"
      - "семейн"
      - "обстоятельств"
      - "причин"
    question_keywords:
      - "академ"
      - "отпуск"
      - "заявлен"
      - "болезн"
      - "здоровь"
      - "семейн"
      - "перерыв"
    fields:
      fio:
        label: "ФИО студента"
        type: "ner_person"
        regex: "(?:от\\s+)?студент[а-я]*[^\\n]{0,80}?([А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+)"
      group_and_course:
        label: "Группа и курс"
        type: "regex"
        regex: "(\\d)\\s*курс[а-я]*\\s+групп[а-я]*\\s*[:\\-]?\\s*([A-Za-zА-Яа-я0-9\\-]+)"
        join_groups: " курс, группа "
      leave_reason:
        label: "Причина отпуска"
        type: "regex"
        regex: "([Пп]о\\s+состоянию\\s+здоровья|по\\s+семейным\\s+обстоятельствам|[Пп]ричин[а-е][^\\n]{2,60}|[Вв]\\s+связи\\s+с[^\\n]{2,60})"
      start_date:
        label: "Дата начала отпуска"
        type: "regex"
        regex: "[Сс]\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
      end_date:
        label: "Дата окончания отпуска"
        type: "regex"
        regex: "(?:[Пп]о|[Дд]о)\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
      application_date:
        label: "Дата подачи заявления"
        type: "regex"
        regex: "(\\d{2}\\.\\d{2}\\.\\d{4})"
        take_last: true
      signature:
        label: "Подпись студента"
        type: "cv_signature_only"

  internship_certificate:
    name: "Справка о практике"
    anchors:
      - "справка о практике"
      - "прохождении практики"
      - "производственной практики"
      - "учебной практики"
      - "преддипломной практики"
      - "руководитель практики"
      - "практику"
    keywords:
      - "практ"
      - "стажир"
      - "руководител"
      - "организаци"
      - "предприяти"
      - "проходил"
      - "оценк"
      - "характеристик"
    question_keywords:
      - "практ"
      - "стажир"
      - "предприят"
      - "организац"
      - "руководител"
      - "оценк"
      - "зачт"
      - "зачесть"
      - "отчет"
    fields:
      fio:
        label: "ФИО студента"
        type: "ner_person"
        regex: "студент[а-я]*\\s+([А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+)"
      organization:
        label: "Организация"
        type: "anchor_after"
        anchors: ["организация", "предприятие", "база практики", "проходил"]
      internship_period:
        label: "Сроки практики"
        type: "regex"
        regex: "[Сс]рок[а-я]*\\s*(?:практики)?\\s*[Сс]?\\s*(\\d{2}\\.\\d{2}\\.\\d{4})\\s*(?:по|-|до)\\s*(\\d{2}\\.\\d{2}\\.\\d{4})"
        join_groups: " по "
      internship_supervisor:
        label: "Руководитель практики"
        type: "ner_person"
        regex: "[Рр]уководител[ья]\\s*(?:практики)?\\s*[:\\-]?\\s*([А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+)"
      grade:
        label: "Оценка"
        type: "options"
        options: ["отлично", "хорошо", "удовлетворительно", "зачтено", "5", "4", "3"]
      doc_number_and_date:
        label: "Номер и дата выдачи"
        type: "regex"
        regex: "№\\s*([A-Za-zА-Яа-я0-9\\-/]+)\\s+от\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
        regex_alt: "(\\d{2}\\.\\d{2}\\.\\d{4})[^\\n]{0,45}?№\\s*([A-Za-zА-Яа-я0-9\\-/]+)"
        alt_swap_groups: true
        join_groups: " от "
      stamp_and_signature:
        label: "Подпись и печать"
        type: "cv_stamp_and_sign"
